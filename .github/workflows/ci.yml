name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect what changed to skip unnecessary builds
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            ts:
              - 'src/**'
              - 'package.json'
              - 'tsconfig.json'
              - '__tests__/**'

  build:
    name: Build — ${{ matrix.settings.target }}
    needs: changes
    # Build if: Rust changed, tag push (release), or first run (no filter baseline)
    if: needs.changes.outputs.rust == 'true' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            host: macos-14
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            host: macos-14
            platform: darwin-x64
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            platform: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-latest
            platform: linux-arm64-gnu
            cross: true
          - target: x86_64-pc-windows-msvc
            host: windows-latest
            platform: win32-x64-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: faugustdev/aiyouvector
          token: ${{ secrets.AIYOUVECTOR_TOKEN }}
          path: _aiyouvector

      # Cargo.toml uses path = "../../../aiyouvector/crates/..."
      # From crates/aiyoucli-napi/, 3 levels up = workspace parent
      - name: Link aiyouvector for Cargo path deps (Unix)
        if: runner.os != 'Windows'
        run: ln -s "$GITHUB_WORKSPACE/_aiyouvector" "$GITHUB_WORKSPACE/../aiyouvector"

      - name: Link aiyouvector for Cargo path deps (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mklink /D "%GITHUB_WORKSPACE%\..\aiyouvector" "%GITHUB_WORKSPACE%\_aiyouvector"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.settings.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # Cross-compilation for Linux ARM64
      - name: Install cross-compilation tools
        if: matrix.settings.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build native module
        shell: bash
        run: npx napi build --platform --release --package aiyoucli-napi -o . --target ${{ matrix.settings.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.platform }}
          path: "*.node"
          if-no-files-found: error

  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: faugustdev/aiyouvector
          token: ${{ secrets.AIYOUVECTOR_TOKEN }}
          path: _aiyouvector

      - name: Link aiyouvector for Cargo path deps
        run: ln -s "$GITHUB_WORKSPACE/_aiyouvector" "$GITHUB_WORKSPACE/../aiyouvector"

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-linux

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run build
      - name: Verify native binding
        run: ls -la *.node
      - run: npm test

  rust-test:
    name: Rust tests
    needs: changes
    # Skip if only TS changed
    if: needs.changes.outputs.rust == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: faugustdev/aiyouvector
          token: ${{ secrets.AIYOUVECTOR_TOKEN }}
          path: _aiyouvector

      - name: Link aiyouvector for Cargo path deps
        run: ln -s "$GITHUB_WORKSPACE/_aiyouvector" "$GITHUB_WORKSPACE/../aiyouvector"

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-linux

      - run: cargo test --workspace

  validate-version:
    name: Validate version sync
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The version lives in 7 hand-edited places. This step used to check only
      # the root package.json, so the platform packages could drift and get
      # published under the wrong version without anyone noticing.
      - name: Tag must match every manifest version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          failed=0

          check() {
            if [ "$2" != "$TAG" ]; then
              echo "::error::$1 is at version $2, expected $TAG"
              failed=1
            else
              echo "ok  $1 = $2"
            fi
          }

          check "package.json" "$(node -p "require('./package.json').version")"

          for dir in npm/*/; do
            check "$dir/package.json" "$(node -p "require('./$dir/package.json').version")"
          done

          # The root package pins its platform packages exactly, so those
          # ranges have to move with the release too.
          for pkg in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            check "optionalDependencies[@aiyou-dev/cli-$pkg]" \
              "$(node -p "require('./package.json').optionalDependencies['@aiyou-dev/cli-$pkg']")"
          done

          check "Cargo.toml" "$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"

          if [ "$failed" -ne 0 ]; then
            echo "::error::Version mismatch — refusing to release"
            exit 1
          fi
          echo "All manifests agree on $TAG"

  publish:
    name: Publish to npm
    # Only run on tag pushes, and only when the ENTIRE build matrix succeeded.
    #
    # This used to be `always() && needs.build.result != 'cancelled'` to
    # tolerate cross-compile failures on openssl-sys. The result was v1.3.1
    # shipping with 3 of 5 platform binaries: users on Intel macOS and Linux
    # ARM64 installed a CLI whose native module could never load. The
    # openssl-sys dependency is gone (the unused `git2` dep that pulled it was
    # removed), so a matrix failure is now a real failure — fail the release
    # instead of publishing a partial one.
    #
    # `rust-test` used to be missing from `needs` entirely: v1.4.0 published
    # to npm with a failing `cargo test --workspace` run and nobody noticed
    # until the tag's own CI summary was checked by hand after the fact. The
    # binaries themselves were fine (a test-cfg-only dead_code lint, not a
    # real bug), but a real regression in `cargo test` must not be able to
    # slip past silently — it has to gate the release like every other check.
    if: startsWith(github.ref, 'refs/tags/v') && needs.validate-version.result == 'success' && needs.build.result == 'success' && needs.rust-test.result == 'success'
    needs: [validate-version, build, rust-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - run: npm install
      - run: npm run build:ts
      - name: Prepare platform packages
        run: node scripts/prepare-publish.js

      # Belt and braces: the job gate already requires a green matrix, but a
      # missing artifact download would otherwise sail through and publish a
      # partial release, which is exactly what happened for v1.3.1.
      - name: Verify all platform binaries are present
        run: |
          missing=0
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            if ! ls "npm/$platform"/*.node >/dev/null 2>&1; then
              echo "::error::Missing native binary for $platform"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to publish a partial release"
            exit 1
          fi
          echo "All 5 platform binaries present."

      - name: Publish platform packages
        run: |
          for dir in npm/*/; do
            if [ -f "$dir/package.json" ] && ls "$dir"/*.node 1>/dev/null 2>&1; then
              PKG_NAME=$(node -p "require('./$dir/package.json').name")
              PKG_VERSION=$(node -p "require('./$dir/package.json').version")
              if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
                echo "Skipping ${PKG_NAME}@${PKG_VERSION} (already published)"
              else
                echo "Publishing ${PKG_NAME}@${PKG_VERSION}..."
                cd "$dir"
                npm publish --provenance --access public
                cd ../..
              fi
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @aiyou-dev/cli
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
            echo "Skipping ${PKG_NAME}@${PKG_VERSION} (already published)"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


